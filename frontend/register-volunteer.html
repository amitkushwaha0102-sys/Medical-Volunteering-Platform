<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Volunteer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Register as Volunteer</h1>
        <form id="volunteerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="text" id="father_name" placeholder="Father's Name" required>
            <input type="text" id="city" placeholder="City" required>
            <input type="text" id="contact_number" placeholder="Contact Number" required>
            <input type="text" id="specialization" placeholder="Specialization" required>
            <button type="submit">Register as Volunteer</button>
        </form>
        <p id="message"></p>
        <a href="index.html">Back to Home</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
