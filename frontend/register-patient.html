<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Patient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏥 Register as Patient</h1>
        <form id="patientForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="text" id="father_name" placeholder="Father's Name" required>
            <input type="text" id="city" placeholder="City" required>
            <input type="text" id="disease" placeholder="Disease/Condition" required>
            <input type="text" id="contact_number" placeholder="Contact Number" required>
            <button type="submit">Register</button>
        </form>
        <p id="message"></p>
        <a href="volunteers.html">Find Volunteers in My City</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
